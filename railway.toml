[project]
name = "catering-project"

[plugins]
  [plugins.frontend]
  service = "frontend"
  start = "npm start"
  type = "nodejs"

  [plugins.backend]
  service = "backend"
  start = "gunicorn -b 0.0.0.0:5000 app:app"
  type = "python"

[[services]]
name = "frontend"
start = "docker build -t frontend ./frontend && docker run -p 3000:3000 frontend"

[[services]]
name = "backend"
start = "docker build -t backend ./backend && docker run -p 5000:5000 backend"

[deploy]
target = "docker"
